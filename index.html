<!DOCTYPE html><html lang='en'><head><meta charset='utf-8'>
<meta name='viewport' content='width=device-width,initial-scale=1'>
<meta name='robots' content='noindex,nofollow,noarchive'><meta name='googlebot' content='noindex,nofollow'>
<title>Jalsa 5.0 — Sign in</title>
<style>
:root { --ink:#111; --mut:#666; --line:#d0d0d0; --bg:#f7f7f8; --acc:#0b5fff;
        --warn:#b45309; --hi:#b91c1c; --ok:#0f7b3f; }
* { box-sizing:border-box; }
body { margin:0; font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",
       Roboto,Arial,sans-serif; color:var(--ink); background:var(--bg); }
.wrap { max-width:1000px; margin:0 auto; padding:0 16px 64px; }
header.top { background:#111; color:#fff; padding:20px 16px 18px; }
header.top .in { max-width:1000px; margin:0 auto; display:flex; gap:16px;
                 align-items:center; }
header.top .txt { flex:1 1 auto; min-width:0; }
header.top img.logo { height:74px; width:auto; border-radius:6px; flex:0 0 auto;
                      background:#fff; }
header.top h1 { margin:0; font-size:28px; letter-spacing:-.4px; line-height:1.1; }
header.top .tag { margin:2px 0 0; color:#f0b429; font-size:13px; font-weight:600;
                  letter-spacing:.3px; }
header.top p { margin:4px 0 0; color:#bbb; font-size:13px; }
header.top .kick { margin:0 0 2px; color:#f0b429; font-size:11px;
                   text-transform:uppercase; letter-spacing:1px; font-weight:700; }
@media print {
  header.top { background:#fff !important; color:#111 !important;
               border-bottom:2px solid #111; padding:0 0 4mm; }
  header.top h1, header.top .tag, header.top p, header.top .kick {
               color:#111 !important; }
  header.top img.logo { height:52px; }
}
nav.jump { position:sticky; top:0; z-index:20; background:#fff;
           border-bottom:1px solid var(--line); padding:8px 16px; }
nav.jump .in { max-width:1000px; margin:0 auto; display:flex; gap:8px;
               align-items:center; flex-wrap:wrap; }
nav.jump input { flex:1 1 200px; min-width:160px; padding:7px 10px; font-size:14px;
                 border:1px solid var(--line); border-radius:6px; }
nav.jump select, nav.jump button { padding:7px 10px; font-size:13px;
   border:1px solid var(--line); border-radius:6px; background:#fff;
   cursor:pointer; }
nav.jump .count { font-size:12.5px; font-weight:600; color:var(--acc);
   background:#eef4ff; border:1px solid #cfe2ff; border-radius:20px;
   padding:5px 11px; white-space:nowrap; }
table.sched tr.hit td { background:#fffbea; }
table.sched tr.hit td:first-child { box-shadow:inset 3px 0 0 var(--acc); }
.lanes { display:flex; gap:10px; align-items:center; flex-wrap:wrap;
   background:#fff; border:1px solid var(--line); border-radius:10px;
   padding:10px 14px; margin:18px 0; font-size:13px; }
nav.jump .lanes { background:transparent; border:0; padding:0; margin:0; }
.lanes .lanehead { font-weight:700; font-size:12px; text-transform:uppercase;
   letter-spacing:.5px; color:var(--mut); }
.lanes .lanehint { color:var(--mut); font-size:12px; flex:1 1 260px;
   min-width:200px; }
label.lanewrap { display:inline-flex; align-items:center; gap:6px;
   font-weight:600; color:#333; }
label.lanewrap select { padding:5px 8px; font-size:13px;
   border:1px solid var(--line); border-radius:6px; background:#fff; }
.people { background:#fff; border:1px solid var(--line); border-radius:10px;
          padding:14px 16px; margin:18px 0; }
.people h2 { margin:0 0 10px; font-size:16px; }
.person { border-top:1px solid #eee; padding:10px 0 12px; }
.person:first-of-type { border-top:0; padding-top:0; }
.person .ph { display:flex; gap:10px; align-items:baseline; flex-wrap:wrap; }
.person .ph b { font-size:15.5px; }
.person .ph span { color:var(--mut); font-size:12.5px; }
.person .ph em { margin-left:auto; font-style:normal; font-size:11px;
   font-weight:700; color:var(--acc); background:#eef4ff; border:1px solid #cfe2ff;
   border-radius:20px; padding:2px 9px; white-space:nowrap; }
.chips { display:flex; flex-wrap:wrap; gap:6px; margin-top:7px; }
a.chip { display:block; text-decoration:none; color:var(--ink);
   border:1px solid var(--line); border-left:3px solid var(--acc);
   border-radius:0 7px 7px 0; padding:5px 9px; background:#fbfcfd;
   min-width:132px; }
a.chip:hover { background:#eef4ff; }
a.chip b { display:block; font-size:13px; }
a.chip i { display:block; font-style:normal; font-size:11.5px; color:#334; }
a.chip u { display:block; text-decoration:none; font-size:10.5px;
           color:var(--mut); margin-top:1px; }
.risks { background:#fff; border:1px solid var(--line); border-radius:10px;
         padding:14px 16px; margin:18px 0; }
.risks h2 { margin:0 0 10px; font-size:16px; }
.risk { border-left:3px solid var(--mut); padding:8px 0 8px 12px; margin:10px 0; }
.risk.high { border-color:var(--hi); } .risk.medium { border-color:var(--warn); }
.risk.low { border-color:var(--mut); }
.risk b { display:block; font-size:14px; }
.risk p { margin:4px 0 0; font-size:13px; color:#333; }
.risk .fix { color:var(--ok); font-weight:600; }
.sevtag { font-size:10px; text-transform:uppercase; letter-spacing:.5px;
          padding:1px 6px; border-radius:3px; color:#fff; margin-right:6px; }
.sevtag.high{background:var(--hi);} .sevtag.medium{background:var(--warn);}
.sevtag.low{background:var(--mut);}
table.sched { width:100%; border-collapse:collapse; background:#fff;
              border:1px solid var(--line); border-radius:10px; overflow:hidden; }
table.sched th, table.sched td { padding:8px 10px; text-align:left;
              border-bottom:1px solid #eee; font-size:13.5px; }
table.sched th { background:#fafafa; font-size:11px; text-transform:uppercase;
              letter-spacing:.5px; color:var(--mut); }
table.sched a { color:var(--acc); text-decoration:none; font-weight:600; }
.dayhead { margin:26px 0 8px; font-size:19px; }
.ev { background:#fff; border:1px solid var(--line); border-radius:10px;
      margin:14px 0; overflow:hidden; }
.ev > summary { cursor:pointer; padding:14px 16px; list-style:none;
      display:flex; gap:10px; align-items:baseline; flex-wrap:wrap; }
.ev > summary::-webkit-details-marker { display:none; }
.ev > summary h3 { margin:0; font-size:17px; flex:1 1 auto; }
.ev > summary .pill { font-size:11px; background:#eef; color:#334;
      padding:2px 8px; border-radius:20px; white-space:nowrap; }
.ev > summary .when { font-size:12.5px; color:var(--mut); }
.body { padding:0 16px 16px; border-top:1px solid #eee; }
.meta { display:flex; flex-wrap:wrap; gap:0; border:1px solid var(--line);
        border-radius:8px; margin:14px 0; overflow:hidden; }
.meta div { padding:8px 12px; border-right:1px solid #eee; flex:1 1 auto;
            min-width:110px; }
.meta div:last-child { border-right:0; }
.meta .k { display:block; font-size:10px; text-transform:uppercase;
           letter-spacing:.5px; color:var(--mut); }
.meta .v { font-size:14px; font-weight:600; }
h4.sec { margin:18px 0 6px; font-size:13px; text-transform:uppercase;
         letter-spacing:.6px; color:var(--mut);
         border-bottom:1px solid #eee; padding-bottom:4px; }
ol.rules, ul.crit { margin:6px 0; padding-left:22px; font-size:14px; }
ol.rules li, ul.crit li { margin:3px 0; }
.changed { background:#fffbeb; border:1px solid #fde68a; border-radius:8px;
           padding:10px 12px; margin:10px 0; font-size:13px; }
.changed b { display:block; margin-bottom:4px; color:var(--warn); }
.changed li { margin:4px 0; }
.warn { background:#fef2f2; border:1px solid #fecaca; border-radius:8px;
        padding:10px 12px; margin:10px 0; font-size:13px; }
.warn b { color:var(--hi); }
.plan { background:#f0f7ff; border:1px solid #cfe2ff; border-radius:8px;
        padding:10px 12px; font-size:13.5px; margin:8px 0 12px; }
.grp { margin:16px 0 0; }
.grp > .lab { font-weight:700; font-size:14.5px; background:#f2f2f2;
      border-left:3px solid #111; padding:6px 10px; border-radius:0 4px 4px 0; }
.grp > .lab span { float:right; font-weight:400; color:#555; font-size:12.5px; }
table.d { width:100%; border-collapse:collapse; margin:8px 0 4px; font-size:13.5px; }
table.d th, table.d td { border:1px solid #ddd; padding:5px 8px; text-align:left; }
table.d th { background:#fafafa; font-size:11px; text-transform:uppercase;
             letter-spacing:.4px; color:var(--mut); }
table.d td.n { width:34px; text-align:center; color:var(--mut); }
table.d td.blank { background:#fcfcfc; }
.heat { border:1px solid #ddd; border-radius:8px; margin:8px 0; }
.heat .hh { background:#fafafa; padding:6px 10px; font-weight:700;
            font-size:13px; border-bottom:1px solid #eee; }
.heat table.d { margin:0; border:0; }
.heat table.d th, .heat table.d td { border-left:0; border-right:0; }
.two { display:grid; grid-template-columns:repeat(auto-fit,minmax(260px,1fr));
       gap:10px; }

/* ---- live team draw ---- */
.drawui { border:1px solid #cbd5e1; border-radius:10px; background:#f8fafc;
          padding:12px 12px 14px; margin:10px 0; }
.drawui .dhead, .lateui .dhead { display:flex; align-items:baseline; gap:10px;
                 justify-content:space-between; flex-wrap:wrap; }
.drawui .dhead b, .lateui .dhead b { font-size:14px; }
.drawui .dhead span, .lateui .dhead span { font-size:11.5px;
                 color:var(--mut); }
.drawui .dnote { margin:6px 0 10px; font-size:12.5px; color:#475569;
                 line-height:1.5; }
.drawui .dnote.sub { margin:6px 0 8px; font-style:italic; }
.dtabs { display:flex; flex-wrap:wrap; gap:6px; margin:0 0 4px; }
.dtabs button { font:inherit; font-size:12.5px; padding:7px 14px; cursor:pointer;
                border:1px solid #cbd5e1; border-radius:999px; background:#fff;
                color:#334155; }
.dtabs button b { font-weight:700; color:var(--hi); }
.dtabs button.on { background:#1e293b; border-color:#1e293b; color:#fff; }
.dtabs button.on b { color:#fff; }
.dpick { display:flex; align-items:center; gap:8px; flex-wrap:wrap;
         margin:0 0 7px; }
.dpick .dcount { font-size:12.5px; color:#475569; margin-right:auto; }
.dpick .dcount b { font-size:14px; color:#0f172a; }
.dpick button { font:inherit; font-size:11.5px; padding:5px 10px; cursor:pointer;
                border:1px solid #cbd5e1; border-radius:6px; background:#fff;
                color:#475569; }
.attend { display:grid; grid-template-columns:repeat(auto-fill,minmax(190px,1fr));
          gap:2px 10px; max-height:340px; overflow:auto; padding:8px;
          border:1px solid #e2e8f0; border-radius:8px; background:#fff; }
.attend .who { display:flex; align-items:center; gap:8px; padding:5px 4px;
               font-size:13.5px; border-radius:5px; cursor:pointer; }
.attend .who:hover { background:#f1f5f9; }
.attend .who input { width:17px; height:17px; flex:none; cursor:pointer; }
.attend .who.out span { color:#94a3b8; text-decoration:line-through; }
.dctl { display:flex; align-items:center; gap:10px; flex-wrap:wrap;
        margin:11px 0 0; font-size:13px; }
.dctl select { font:inherit; font-size:13px; padding:5px 7px;
               border:1px solid #cbd5e1; border-radius:6px; background:#fff; }
.dctl button { font:inherit; font-size:13px; padding:8px 16px; cursor:pointer;
               border-radius:7px; border:1px solid #1e293b; background:#1e293b;
               color:#fff; font-weight:600; }
.dctl button.ghost { background:#fff; color:#475569; border-color:#cbd5e1;
                     font-weight:400; }
.dctl .dhint { font-size:12px; color:var(--mut); }
.dresult { margin-top:13px; padding-top:11px; border-top:1px dashed #cbd5e1; }
.dresult .dtitle { font-size:13px; font-weight:700; margin:0 0 7px; }
.dresult .dtitle em { font-weight:400; font-style:normal; font-size:11.5px;
                      color:var(--mut); }
/* ---- late entries ---- */
.lateui { border:1px solid #fcd34d; border-radius:10px; background:#fffbeb;
          padding:12px; margin:14px 0 0; }
.lateform { display:flex; gap:7px; flex-wrap:wrap; align-items:center; }
.lateform input, .lateform select { font:inherit; font-size:14px; padding:8px 9px;
    border:1px solid #d6d3c8; border-radius:6px; background:#fff; }
.lateform input[data-f=n] { flex:1 1 180px; min-width:150px; }
.lateform button { font:inherit; font-size:13.5px; font-weight:600; padding:9px 18px;
    cursor:pointer; border-radius:7px; border:1px solid #92400e;
    background:#92400e; color:#fff; }
.lateerr { margin:8px 0 0; font-size:12.5px; color:#b91c1c; }
.latelist { list-style:none; margin:10px 0 0; padding:0; }
.latelist li { display:flex; align-items:center; gap:8px; flex-wrap:wrap;
    padding:7px 9px; margin:4px 0; font-size:13.5px; background:#fff;
    border:1px solid #f0e6c8; border-radius:6px; }
.latelist .lc, .latelist .lb { font-size:11.5px; color:#57534e;
    background:#f5f5f4; border-radius:4px; padding:2px 7px; }
.latelist em { font-style:normal; font-size:11px; color:var(--mut);
    margin-left:auto; }
.latelist .rm { font:inherit; font-size:11.5px; padding:4px 9px; cursor:pointer;
    border:1px solid #d6d3c8; border-radius:5px; background:#fff; color:#b91c1c; }
.latefoot { display:flex; align-items:center; gap:9px; margin:9px 0 0; }
.latefoot button { font:inherit; font-size:12.5px; padding:6px 12px;
    cursor:pointer; border:1px solid #d6d3c8; border-radius:6px; background:#fff;
    color:#44403c; }
.latefoot .copied { font-size:12px; color:#15803d; }
.lateadd { background:#fffbeb; border:1px solid #fcd34d; border-radius:8px;
    padding:8px 11px; margin:6px 0; font-size:12.5px; line-height:1.5;
    color:#713f12; }
.lateflag { font-style:normal; font-size:10px; text-transform:uppercase;
    letter-spacing:.04em; background:#fef3c7; color:#92400e; border-radius:4px;
    padding:1px 6px; margin-left:5px; }
tr.islate td { background:#fffdf5; }
.attend .who.islate span { font-weight:600; }

details.rawlist { margin:8px 0 0; }
details.rawlist > summary { cursor:pointer; font-size:12.5px; color:#475569;
                           padding:6px 0; }
details.rawlist > summary:hover { color:#0f172a; }
.mrow { display:flex; align-items:center; gap:8px; padding:6px 10px;
        border:1px solid #ddd; border-radius:6px; margin:6px 0; font-size:13.5px; }
.mrow .mno { font-size:11px; color:var(--mut); min-width:26px; }
.mrow .vs { color:var(--mut); font-size:11px; }
.mrow .side { font-weight:600; flex:1 1 0; }
.mrow .res { border-bottom:1px dotted #999; min-width:80px; height:16px; }
.byes { font-size:13px; color:#444; margin:6px 0; }
.guide { border:1px solid var(--line); border-left:3px solid #64748b;
         border-radius:0 8px 8px 0; padding:10px 12px; margin:8px 0;
         background:#fbfcfd; font-size:13.5px; }
.guide b { display:block; margin-bottom:4px; font-size:12px;
           text-transform:uppercase; letter-spacing:.5px; color:#475569; }
.guide ol, .guide ul { margin:4px 0 0; padding-left:20px; }
.guide li { margin:4px 0; }
.guide.kit { border-left-color:#0ea5e9; }
.guide.steps { border-left-color:#111; }
.guide.decide { border-left-color:var(--ok); background:#f6fbf7; }
.guide.watch { border-left-color:var(--hi); background:#fef7f7; }
.backlink { display:inline-block; margin:0 0 4px; font-size:13px;
            color:var(--acc); text-decoration:none; font-weight:600; }
.evpage h1 { margin:2px 0 0; font-size:26px; letter-spacing:-.3px; }
.prevnext { display:flex; justify-content:space-between; gap:10px;
            margin:22px 0 0; font-size:13.5px; }
.prevnext a { color:var(--acc); text-decoration:none; font-weight:600;
              background:#fff; border:1px solid var(--line); border-radius:8px;
              padding:8px 12px; }
footer.f { text-align:center; color:var(--mut); font-size:12px; padding:30px 16px; }
footer.f .copy { margin-top:8px; padding-top:8px; font-size:11.5px;
   color:#8a8a8a; border-top:1px solid var(--line); display:inline-block;
   min-width:min(420px,80%); }
.seed { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; }
/* ---------------- mobile ---------------- */
@media (max-width:760px) {
  body { font-size:14.5px; }
  .wrap { padding:0 10px 48px; }
  header.top { padding:14px 12px; }
  header.top .in { gap:11px; align-items:flex-start; }
  header.top img.logo { height:52px; }
  header.top h1 { font-size:21px; }
  header.top p { font-size:12px; }
  nav.jump { padding:7px 10px; }
  nav.jump .in { gap:6px; }
  nav.jump input { flex:1 1 100%; order:-1; font-size:15px; }
  nav.jump select, nav.jump button, nav.jump .count { font-size:12.5px;
      padding:6px 8px; }
  .lanes { padding:9px 11px; gap:8px; }
  .lanes .lanehint { flex:1 1 100%; }
  /* wide tables scroll sideways instead of squashing */
  table.d, table.sched { display:block; overflow-x:auto;
      -webkit-overflow-scrolling:touch; white-space:nowrap; }
  table.d th, table.d td, table.sched th, table.sched td { padding:6px 8px; }
  .two { grid-template-columns:1fr; }
  .ev > summary { padding:12px; flex-direction:column; gap:3px; }
  .ev > summary h3 { font-size:16px; }
  .ev > summary .pill { align-self:flex-start; }
  .body { padding:0 12px 14px; }
  .meta { flex-direction:column; }
  .meta div { border-right:0; border-bottom:1px solid #eee; min-width:0; }
  .meta div:last-child { border-bottom:0; }
  .mrow { flex-wrap:wrap; }
  .mrow .side { flex:1 1 40%; min-width:34%; }
  .chips { gap:5px; }
  a.chip { min-width:0; flex:1 1 100%; }
  .person .ph em { margin-left:0; }
  .prevnext { flex-direction:column; }
  .prevnext a { text-align:center; }
  .guide ol, .guide ul { padding-left:18px; }
  h1.title { font-size:18px; }
}
@media (max-width:420px) {
  header.top img.logo { height:42px; }
  header.top h1 { font-size:18px; }
  .ev > summary .when { font-size:11.5px; }
}

@media print {
  body { background:#fff; font-size:10.5pt; }
  nav.jump, .noprint { display:none !important; }
  .ev { break-inside:avoid; page-break-inside:avoid; border:0;
        border-top:2px solid #111; border-radius:0; margin:0 0 8mm; }
  .ev > summary { padding:6mm 0 2mm; }
  .body { padding:0; border:0; }
  details { display:block; }
  details > .body { display:block !important; }
  thead { display:table-header-group; }
  /* On paper the tick list and the buttons are useless; the drawn teams are
     the whole point, so print those and drop the controls. */
  .dtabs, .dpick, .dctl, .attend, .drawui .dnote { display:none !important; }
  .lateform, .lateerr, .latefoot, .lateui .dnote, .latelist .rm {
    display:none !important; }
  .lateui { border:1px solid #999; background:#fff; }
  .drawui { border:0; background:#fff; padding:0; margin:0; }
  .dresult { border-top:0; margin-top:4mm; padding-top:0; }
  .heat { break-inside:avoid; page-break-inside:avoid; }
  @page { size:A4; margin:12mm 10mm; }
}

.gate { max-width:390px; margin:8vh auto 0; background:#fff;
        border:1px solid var(--line); border-radius:12px; padding:26px 24px;
        box-shadow:0 2px 14px rgba(0,0,0,.08); }
.gate img { height:76px; display:block; margin:0 auto 14px; border-radius:8px; }
.gate h1 { margin:0 0 4px; font-size:22px; text-align:center; }
.gate p.sub { margin:0 0 18px; text-align:center; color:var(--mut);
              font-size:13px; }
.gate label { display:block; font-size:12px; font-weight:700;
              text-transform:uppercase; letter-spacing:.5px; color:var(--mut);
              margin:12px 0 4px; }
.gate input { width:100%; padding:11px 12px; font-size:16px;
              border:1px solid var(--line); border-radius:8px; }
.gate button { width:100%; margin-top:18px; padding:12px; font-size:15px;
               font-weight:700; color:#fff; background:#111; border:0;
               border-radius:8px; cursor:pointer; }
.gate button:disabled { opacity:.6; cursor:default; }
.gate .err { margin-top:12px; padding:9px 11px; background:#fef2f2;
             border:1px solid #fecaca; border-radius:8px; color:var(--hi);
             font-size:13px; }
.gate .note { margin-top:16px; font-size:11.5px; color:var(--mut);
              text-align:center; line-height:1.5; }
.who { font-size:12.5px; color:#bbb; }
.who b { color:#f0b429; }
#app { display:none; }
@media (max-width:760px) { .gate { margin:4vh 10px 0; padding:20px 16px; } }

<script>
function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c];
  });
}
// ---- lane-driven heat builder ---------------------------------------------
// Mirrors heat_geometry() in formats.py exactly. The running order is drawn
// once with the published seed and never changes here; lanes only decide where
// that fixed order is cut, so changing lanes cannot re-randomise anybody.
function heatGeometry(n, lanes) {
  if (n <= 0) return null;
  lanes = Math.max(2, parseInt(lanes, 10) || 2);
  if (n <= lanes) {
    return { straight: true, lanes: lanes, n: n, sizes: [n], nHeats: 1,
      finalSize: n, fastest: 0,
      qualify: 'Straight final — all ' + n + ' go together on ' + lanes +
               ' lanes, no heats needed.' };
  }
  var nHeats = Math.ceil(n / lanes);
  var base = Math.floor(n / nHeats), extra = n % nHeats, sizes = [];
  for (var h = 0; h < nHeats; h++) sizes.push(base + (h < extra ? 1 : 0));
  var finalSize = Math.min(lanes, n), fastest = finalSize - nHeats, q;
  var art = String(finalSize)[0] === '8' ? 'an' : 'a';
  if (fastest > 0) {
    q = 'Winner of each of the ' + nHeats + ' heats goes through (' + nHeats +
        ' places). That leaves ' + fastest + ' spare lane' +
        (fastest !== 1 ? 's' : '') + ' in ' + art + ' ' + finalSize +
        '-lane final, filled by one extra qualifying heat among the runners-up.';
  } else if (fastest === 0) {
    q = 'Winner of each of the ' + nHeats + ' heats goes straight through and ' +
        'exactly fills the ' + finalSize + '-lane final. No extra qualifying ' +
        'heat needed.';
  } else {
    var short = -fastest;
    q = nHeats + ' heats but only ' + finalSize + ' lanes in the final, so the ' +
        nHeats + ' heat winners cannot all run it. Run a semi-final between the ' +
        'heat winners first, and take the top ' + finalSize + ' from that. ' +
        short + ' winner' + (short !== 1 ? 's' : '') + ' will not reach the ' +
        'final — announce this before the heats are run.';
  }
  return { straight: false, lanes: lanes, n: n, sizes: sizes, nHeats: nHeats,
    finalSize: finalSize, fastest: Math.max(0, fastest), qualify: q };
}

function nameRows(list, cols, lateSet) {
  var o = ["<table class='d'><thead><tr><th class='n'>#</th><th>Participant</th>"];
  cols.forEach(function (c) { o.push('<th>' + esc(c) + '</th>'); });
  o.push('</tr></thead><tbody>');
  list.forEach(function (nm, i) {
    var late = lateSet && lateSet[nm];
    o.push("<tr" + (late ? " class='islate'" : '') + "><td class='n'>" + (i + 1) +
      "</td><td><b>" + esc(nm) + '</b>' +
      (late ? " <i class='lateflag'>added on the day</i>" : '') + '</td>');
    cols.forEach(function () { o.push("<td class='blank'></td>"); });
    o.push('</tr>');
  });
  o.push('</tbody></table>');
  return o.join('');
}

// ---- late entries ---------------------------------------------------------
// Somebody always turns up on the day wanting to be added. There is no server
// and no shared database, so these live in this browser's localStorage only:
// whoever adds a name sees it, nobody else does, and it is gone if the browser
// data is cleared. That is a deliberate limit, not an oversight - the
// alternative was pushing children's names and flat numbers to a public GitHub
// repo in plain text, which is the exact thing the encrypted build exists to
// prevent. "Copy for the organiser" is how a late entry gets back into the
// spreadsheet after the event.
function lateKey(slug) { return 'jalsa_late_' + slug; }

function lateAll(slug) {
  try {
    var a = JSON.parse(localStorage.getItem(lateKey(slug)));
    return Array.isArray(a) ? a : [];
  } catch (e) { return []; }
}

function lateSave(slug, arr) {
  try { localStorage.setItem(lateKey(slug), JSON.stringify(arr)); } catch (e) {}
}

// Names added for one category. Events with a single unnamed group pass '' and
// get everything.
function lateFor(slug, cat) {
  return lateAll(slug).filter(function (x) {
    return !cat || !x.c || x.c === cat;
  }).map(function (x) { return x.n; });
}

function lateSet(slug) {
  var m = {};
  lateAll(slug).forEach(function (x) { m[x.n] = 1; });
  return m;
}

// Re-render everything a new name could affect, so one "Add" updates the heats,
// the draw pool and the late list together.
function lateRefresh() {
  applyLanes();
  initDraw();
  initLate();
  initLists();
}

function renderLateBlock(el) {
  var d = JSON.parse(el.getAttribute('data-late'));
  var rows = lateAll(d.slug);
  var cats = (d.cats || []).filter(function (c) {
    return c && c !== 'Draw' && c !== 'All Participants';
  });
  var o = [];

  o.push("<div class='lateui'>");
  o.push("<div class='dhead'><b>Add someone on the day</b>" +
    (rows.length ? "<span>" + rows.length + " added" + '</span>' : '') + '</div>');
  o.push("<p class='dnote'>Saved on this device only. Other moderators and the " +
    "admin will not see it, and it is not written back to the spreadsheet — " +
    "use <b>Copy for the organiser</b> at the end so the record can be updated." +
    '</p>');

  o.push("<div class='lateform'>");
  o.push("<input type='text' data-f='n' placeholder='Name' autocomplete='off'>");
  if (d.blocks && d.blocks.length) {
    o.push("<select data-f='b'><option value=''>Block</option>");
    d.blocks.forEach(function (b) {
      o.push("<option value='" + esc(b) + "'>" + esc(b) + '</option>');
    });
    o.push('</select>');
  } else {
    o.push("<input type='text' data-f='b' placeholder='Block' " +
      "autocomplete='off' size='6'>");
  }
  o.push("<input type='text' data-f='f' placeholder='Flat' autocomplete='off' " +
    "size='6'>");
  if (cats.length) {
    o.push("<select data-f='c'>");
    cats.forEach(function (c) {
      o.push("<option value='" + esc(c) + "'>" + esc(c) + '</option>');
    });
    o.push('</select>');
  }
  o.push("<button type='button' data-add='1'>Add</button>");
  o.push('</div>');
  o.push("<p class='lateerr' hidden></p>");

  if (rows.length) {
    o.push("<ul class='latelist'>");
    rows.forEach(function (x, i) {
      o.push("<li><b>" + esc(x.n) + '</b>' +
        (x.c ? " <span class='lc'>" + esc(x.c) + '</span>' : '') +
        (x.b || x.f ? " <span class='lb'>" +
          esc([x.b, x.f].filter(Boolean).join(' / ')) + '</span>' : '') +
        (x.t ? " <em>" + esc(x.t) + '</em>' : '') +
        " <button type='button' class='rm' data-rm='" + i +
        "' aria-label='Remove " + esc(x.n) + "'>Remove</button></li>");
    });
    o.push('</ul>');
    o.push("<div class='latefoot'>");
    o.push("<button type='button' data-copy='1'>Copy for the organiser</button>");
    o.push("<span class='copied' hidden>Copied</span>");
    o.push('</div>');
  }
  o.push('</div>');
  el.innerHTML = o.join('');

  var err = el.querySelector('.lateerr');
  function fail(msg) { err.textContent = msg; err.hidden = false; }

  el.querySelectorAll('[data-add]').forEach(function (b) {
    b.addEventListener('click', function () {
      var get = function (f) {
        var i = el.querySelector("[data-f='" + f + "']");
        return i ? String(i.value || '').trim() : '';
      };
      var nm = get('n');
      err.hidden = true;
      if (!nm) { fail('Enter a name.'); return; }
      var clash = d.people.concat(lateAll(d.slug).map(function (x) { return x.n; }))
        .some(function (x) { return x.toLowerCase() === nm.toLowerCase(); });
      if (clash) {
        fail(nm + ' is already on this list. Check the registered names first.');
        return;
      }
      var rows2 = lateAll(d.slug);
      rows2.push({ n: nm, b: get('b'), f: get('f'),
        c: cats.length ? (get('c') || cats[0]) : '',
        t: new Date().toLocaleTimeString([], { hour: '2-digit',
          minute: '2-digit' }) });
      lateSave(d.slug, rows2);
      lateRefresh();
    });
  });

  el.querySelectorAll('[data-rm]').forEach(function (b) {
    b.addEventListener('click', function () {
      var i = parseInt(b.getAttribute('data-rm'), 10);
      var rows2 = lateAll(d.slug);
      if (!confirm('Remove ' + rows2[i].n + ' from this event?')) return;
      rows2.splice(i, 1);
      lateSave(d.slug, rows2);
      lateRefresh();
    });
  });

  el.querySelectorAll('[data-copy]').forEach(function (b) {
    b.addEventListener('click', function () {
      var txt = [d.event + ' — added on the day'].concat(
        lateAll(d.slug).map(function (x) {
          return '- ' + x.n + [x.b, x.f].filter(Boolean).map(function (v) {
            return ', ' + v; }).join('') + (x.c ? ' (' + x.c + ')' : '') +
            (x.t ? ' at ' + x.t : '');
        })).join('\n');
      var done = el.querySelector('.copied');
      var show = function () {
        if (done) { done.hidden = false;
          setTimeout(function () { done.hidden = true; }, 2000); }
      };
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(txt).then(show, function () {
          prompt('Copy this and send it to the organiser:', txt);
        });
      } else {
        prompt('Copy this and send it to the organiser:', txt);
      }
    });
  });
}

function renderHeatBlock(el) {

  var extra = data.slug ? lateFor(data.slug, data.cat) : [];
  var order = data.order.concat(extra);

  var geo = heatGeometry(order.length, lanes);
  var o = ["<div class='plan'><b>Round plan.</b> " + esc(geo.qualify) + '</div>'];

  }
  var i = 0;
  o.push("<div class='two'>");
  geo.sizes.forEach(function (size, h) {
    var slice = order.slice(i, i + size); i += size;
    var title = geo.straight ? 'FINAL' : 'Heat ' + (h + 1);
    o.push("<div class='heat'><div class='hh'>" + title + ' &middot; ' +
      slice.length + ' lane' + (slice.length !== 1 ? 's' : '') + '</div>');
    o.push(nameRows(slice, ['Lane', data.invert ? 'Time / Legal' : 'Time', 'Pos'],
      flag));
    o.push('</div>');
  });
  o.push('</div>');
  if (!geo.straight) {
    o.push("<div class='heat'><div class='hh'>FINAL &middot; " + geo.finalSize +
      ' lanes</div>');
    var blanks = []; for (var k = 0; k < geo.finalSize; k++) blanks.push('');
    o.push(nameRows(blanks, ['Qualified from', 'Time', 'Pos']));
    o.push('</div>');
  }
  el.innerHTML = o.join('');
}

function laneCount(kind) {

                                                         : TRACK_DEFAULT);

// ---- live team draw, for events not drawn in advance ----------------------
// Deliberately NOT seeded. The published seed exists so a pre-drawn bracket can
// be shown to be reproducible; this draw happens in front of everyone, from
// whoever actually turned up, so a fresh shuffle each time is the honest thing.
//
// Registrations cannot be trusted to be eligible - men and children signed up
// for Dodge Ball (Women), and Tug of War has no gender in the data at all - so
// the moderator ticks who is actually playing and the randomiser only ever sees
// that list. Everything is kept in localStorage so a refresh, or a phone that
// locks itself, does not lose teams that have already been announced.
function drawKey(slug) { return 'jalsa_draw_' + slug; }

// Everyone registered plus anyone added on the day.
function drawPeople(d) {
  return d.people.concat(lateFor(d.slug, ''));
}

function drawState(d) {
  var s = null;
  try { s = JSON.parse(localStorage.getItem(drawKey(d.slug))); } catch (e) {}
  if (!s || typeof s !== 'object') s = {};
  if (!s.sel || typeof s.sel !== 'object') s.sel = {};
  if (!s.nteams || typeof s.nteams !== 'object') s.nteams = {};
  if (!s.drawn || typeof s.drawn !== 'object') s.drawn = {};
  if (!s.at || typeof s.at !== 'object') s.at = {};
  if (!s.seen || typeof s.seen !== 'object') s.seen = {};
  var fresh = !Object.keys(s.seen).length;
  d.cats.forEach(function (cat, i) {
    if (!s.sel[i] || typeof s.sel[i] !== 'object') s.sel[i] = {};
  });
  // One category: tick names the moderator has not been shown before, so the
  // list starts complete and a late entry joins the draw without extra taps.
  // Several categories: never auto-tick, because the moderator is picking out
  // one group at a time and a stray tick would put someone in the wrong contest.
  drawPeople(d).forEach(function (n) {
    if (s.seen[n]) return;
    s.seen[n] = 1;
    if (d.cats.length === 1) s.sel[0][n] = 1;
  });
  if (fresh) saveDraw(d, s);
  return s;
}

function saveDraw(d, s) {
  try { localStorage.setItem(drawKey(d.slug), JSON.stringify(s)); } catch (e) {}
}

function shuffleNow(list) {
  var a = list.slice();
  for (var i = a.length - 1; i > 0; i--) {
    var j = Math.floor(Math.random() * (i + 1));
    var t = a[i]; a[i] = a[j]; a[j] = t;
  }
  return a;
}

// Round-robin dealing after the shuffle, so team sizes never differ by more
// than one however the numbers fall.
function dealTeams(names, n) {
  n = Math.max(2, Math.min(12, parseInt(n, 10) || 2));
  if (names.length < n) n = Math.max(2, names.length);
  var teams = [];
  for (var i = 0; i < n; i++) teams.push([]);
  shuffleNow(names).forEach(function (nm, i) { teams[i % n].push(nm); });
  return teams.filter(function (t) { return t.length; });
}

function drawPicked(d, s, i) {
  return drawPeople(d).filter(function (n) { return s.sel[i] && s.sel[i][n]; });
}

function renderDrawBlock(el) {
  var d = JSON.parse(el.getAttribute('data-draw'));
  var s = drawState(d);
  var all = drawPeople(d);
  var late = lateSet(d.slug);
  var multi = d.cats.length > 1;
  var cur = Math.min(parseInt(el.dataset.cat || '0', 10), d.cats.length - 1);
  var picked = drawPicked(d, s, cur);
  var o = [];

  o.push("<div class='drawui'>");
  o.push("<div class='dhead'><b>Draw the teams</b>" +
    "<span>" + d.people.length + " registered" +
    (all.length > d.people.length
      ? " + " + (all.length - d.people.length) + " added on the day" : '') +
    "</span></div>");
  o.push("<p class='dnote'>Tick who is actually playing, then randomise. " +
    "Registering is not the same as being eligible or turning up, so the draw " +
    "only ever uses the names you tick. Do it in front of everyone.</p>");

  // ---- which category are we drawing, when the event has more than one
  if (multi) {
    o.push("<div class='dtabs'>");
    d.cats.forEach(function (cat, i) {
      var n = drawPicked(d, s, i).length;
      o.push("<button type='button' data-cat='" + i + "'" +
        (i === cur ? " class='on'" : '') + '>' + esc(cat) +
        (n ? " <b>" + n + '</b>' : '') +
        (s.drawn[i] ? " &check;" : '') + '</button>');
    });
    o.push('</div>');
    o.push("<p class='dnote sub'>Draw each one separately. " +
      esc(d.cats.join(' and ')) + " are kept apart and both are saved.</p>");
  }

  // ---- the tick list
  o.push("<div class='dpick'>");
  o.push("<span class='dcount'><b>" + picked.length + "</b> of " +
    all.length + ' ticked' + (multi ? ' for ' + esc(d.cats[cur]) : '') +
    '</span>');
  o.push("<button type='button' data-all='1'>Tick all</button>");
  o.push("<button type='button' data-all='0'>Untick all</button>");
  o.push('</div>');

  o.push("<div class='attend'>");
  all.forEach(function (n) {
    var on = !!(s.sel[cur] && s.sel[cur][n]);
    o.push("<label class='who" + (on ? '' : ' out') + (late[n] ? ' islate' : '') +
      "'><input type='checkbox' data-who='" + esc(n) + "'" +
      (on ? ' checked' : '') + "><span>" + esc(n) +
      (late[n] ? " <i class='lateflag'>new</i>" : '') + '</span></label>');
  });
  o.push('</div>');

  // ---- how many teams, and go
  var n = s.nteams[cur] || 2;
  o.push("<div class='dctl'>");
  o.push("<label>Split into <select data-teams='1'>");
  for (var k = 2; k <= 12; k++) {
    o.push("<option value='" + k + "'" + (k === n ? ' selected' : '') + '>' + k +
      '</option>');
  }
  o.push('</select> teams</label>');
  o.push("<button type='button' class='go' data-go='1'>" +
    (s.drawn[cur] ? 'Randomise again' : 'Randomise') + '</button>');
  if (s.drawn[cur]) {
    o.push("<button type='button' class='ghost' data-clear='1'>Clear</button>");
  }
  if (picked.length >= 2) {
    var per = Math.floor(picked.length / n), rem = picked.length % n;
    o.push("<span class='dhint'>" + picked.length + ' players &rarr; ' +
      (rem ? rem + ' team' + (rem !== 1 ? 's' : '') + ' of ' + (per + 1) +
             ' and ' + (n - rem) + ' of ' + per
           : n + ' teams of ' + per) + '</span>');
  }
  o.push('</div>');

  // ---- every category's result, so nothing already drawn is hidden
  d.cats.forEach(function (cat, i) {
    var teams = s.drawn[i];
    if (!teams || !teams.length) return;
    o.push("<div class='dresult'>");
    o.push("<div class='dtitle'>" + (multi ? esc(cat) + ' &middot; ' : '') +
      teams.length + ' teams' +
      (s.at[i] ? " <em>drawn at " + esc(s.at[i]) + '</em>' : '') + '</div>');
    o.push("<div class='two'>");
    teams.forEach(function (members, t) {
      o.push("<div class='heat'><div class='hh'>" +
        (multi ? esc(cat) + ' &mdash; ' : '') + 'Team ' + (t + 1) +
        ' &middot; ' + members.length +
        (members.length === 1 ? ' player' : ' players') + '</div>');
      o.push(nameRows(members, ['Notes'], late));
      o.push('</div>');
    });
    o.push('</div></div>');
  });

  o.push('</div>');
  el.innerHTML = o.join('');

  function redraw() { renderDrawBlock(el); }

  el.querySelectorAll('[data-cat]').forEach(function (b) {
    b.addEventListener('click', function () {
      el.dataset.cat = b.getAttribute('data-cat');
      redraw();
    });
  });
  el.querySelectorAll('[data-who]').forEach(function (inp) {
    inp.addEventListener('change', function () {
      var nm = inp.getAttribute('data-who');
      if (inp.checked) s.sel[cur][nm] = 1; else delete s.sel[cur][nm];
      saveDraw(d, s);
      // update the count and the row styling without rebuilding the whole list,
      // so a long list does not jump back to the top on every tick
      inp.parentNode.classList.toggle('out', !inp.checked);
      var c = el.querySelector('.dcount b');
      if (c) c.textContent = drawPicked(d, s, cur).length;
    });
  });
  el.querySelectorAll('[data-all]').forEach(function (b) {
    b.addEventListener('click', function () {
      var on = b.getAttribute('data-all') === '1';
      s.sel[cur] = {};
      if (on) drawPeople(d).forEach(function (nm) { s.sel[cur][nm] = 1; });
      saveDraw(d, s);
      redraw();
    });
  });
  el.querySelectorAll('[data-teams]').forEach(function (sel) {
    sel.addEventListener('change', function () {
      s.nteams[cur] = parseInt(sel.value, 10);
      saveDraw(d, s);
      redraw();
    });
  });
  el.querySelectorAll('[data-go]').forEach(function (b) {
    b.addEventListener('click', function () {
      var pool = drawPicked(d, s, cur);
      if (pool.length < 2) {
        alert('Tick at least two players before randomising.');
        return;
      }
      if (s.drawn[cur] && !confirm('Randomise ' +
          (multi ? d.cats[cur] : 'the teams') +
          ' again? The teams already drawn will be replaced.')) return;
      s.drawn[cur] = dealTeams(pool, s.nteams[cur] || 2);
      s.at[cur] = new Date().toLocaleTimeString([], { hour: '2-digit',
        minute: '2-digit' });
      saveDraw(d, s);
      redraw();
    });
  });
  el.querySelectorAll('[data-clear]').forEach(function (b) {
    b.addEventListener('click', function () {
      delete s.drawn[cur];
      delete s.at[cur];
      saveDraw(d, s);
      redraw();
    });
  });
}

    var nb = Math.max(1, Math.ceil(n / (d.batch || n || 1)));
    head = n + ' participant' + (n === 1 ? '' : 's') + ', ' + nb + ' batch' +

// ---------------- crypto helpers ----------------
function b64d(s) {
  var raw = atob(s), out = new Uint8Array(raw.length);
  for (var i = 0; i < raw.length; i++) out[i] = raw.charCodeAt(i);
  return out;
}
async function deriveKek(password, saltB64) {
  var base = await crypto.subtle.importKey('raw', new TextEncoder().encode(password),
    'PBKDF2', false, ['deriveBits']);
  var bits = await crypto.subtle.deriveBits(
    { name: 'PBKDF2', salt: b64d(saltB64), iterations: BUNDLE.kdf.iters,
      hash: BUNDLE.kdf.hash }, base, 256);
  return new Uint8Array(bits);
}
async function aesKey(raw) {
  return crypto.subtle.importKey('raw', raw, 'AES-GCM', false, ['decrypt']);
}
async function open_(keyRaw, box) {
  var k = await aesKey(keyRaw);
  var pt = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64d(box.iv) },
    k, b64d(box.ct));
  return new Uint8Array(pt);
}
function txt(u8) { return new TextDecoder().decode(u8); }

// ---------------- login ----------------
var SESSION = null;

async function login(username, password) {
  var u = BUNDLE.users[username];
  if (!u) throw new Error('Unknown username or wrong password.');
  var kek = await deriveKek(password, u.salt);
  try {
    var ok = txt(await open_(kek, u.verify));
    if (ok !== 'jalsa-ok') throw new Error('bad');
  } catch (e) {
    throw new Error('Unknown username or wrong password.');
  }
  // unwrap only the events this user holds keys for
  var events = [];
  for (var eid in u.keys) {
    var ek = await open_(kek, u.keys[eid]);
    var blob = JSON.parse(txt(await open_(ek, BUNDLE.events[eid])));
    blob.id = eid;
    events.push(blob);
  }
  var commonKey = await open_(kek, u.common);
  var commonHtml = txt(await open_(commonKey, BUNDLE.common));
  return { user: u, username: username, events: events, common: commonHtml };
}


// ---------------- shared helpers ----------------
function searchBlob(e) {
  return (e.meta.name + ' ' + e.meta.day + ' ' + e.meta.place + ' ' +
    e.people.map(function (p) { return p[0]; }).join(' ')).toLowerCase();
}
function modsOf(e) {
  return (e.meta.mods || '').split(/[,\/&]| and /)
    .map(function (m) { return m.trim().toLowerCase(); })
    .filter(Boolean).join(' ');
}
// FMT and DAYS are injected by build_secure.py from the Python definitions, so
// the labels and the day list can never drift from the rest of the build.
var DAYORDER = {};
DAYS.forEach(function (d, i) { DAYORDER[d] = i; });
function mins(t) {
  var m = /^(\d+):(\d+)\s*(AM|PM)$/i.exec(t || '');
  if (!m) return 9 * 60;
  var hh = parseInt(m[1], 10) % 12;
  if (/pm/i.test(m[3])) hh += 12;
  return hh * 60 + parseInt(m[2], 10);
}
function sortEvents(list) {
  return list.slice().sort(function (a, b) {
    var d = (DAYORDER[a.meta.day] === undefined ? DAYS.length : DAYORDER[a.meta.day]) -
            (DAYORDER[b.meta.day] === undefined ? DAYS.length : DAYORDER[b.meta.day]);
    if (d) return d;
    var t = mins(a.meta.time) - mins(b.meta.time);
    if (t) return t;
    var an = parseInt((a.meta.name.match(/\d+/) || [0])[0], 10);
    var bn = parseInt((b.meta.name.match(/\d+/) || [0])[0], 10);
    var ab = a.meta.name.replace(/\d+/g, ''), bb = b.meta.name.replace(/\d+/g, '');
    return ab.localeCompare(bb) || (an - bn);
  });
}

// ---------------- header + nav ----------------
function shellHtml(s, view) {
  var ev = SESSION.ordered, o = [];
  o.push("<header class='top'><div class='in'>");
  if (LOGO) o.push("<img class='logo' src='" + LOGO + "' alt='Jalsa 5.0'>");
  o.push("<div class='txt'><h1>Jalsa 5.0</h1>");
  o.push("<p class='tag'>Sports Day 2026 — Control Book</p>");
  o.push("<p class='who'>Signed in as <b>" + esc(s.user.label) + "</b> &middot; " +
    (s.user.role === 'admin' ? 'admin, all events'
      : ev.length + (ev.length === 1 ? ' event' : ' events') + ' assigned to you') +
    " &middot; draw seed " + BUNDLE.seed + "</p>");
  o.push("</div></div></header>");
  o.push("<nav class='jump'><div class='in'>");
  if (view === 'one') {
    o.push("<a class='backlink' href='#/'>&#8592; All events</a>");
  } else {
    o.push("<input id='q' type='search' placeholder='Search event or participant name…'>");
    o.push("<select id='day'><option value='all'>All days</option>");
    DAYS.forEach(function (d) {
      o.push("<option value='" + esc(d) + "'>" + esc(d) + "</option>");
    });
    o.push("</select>");
    var mods = {};
    ev.forEach(function (e) {
      modsOf(e).split(' ').forEach(function (k) {
        if (k) mods[k] = k.charAt(0).toUpperCase() + k.slice(1);
      });
    });
    o.push("<select id='mod'><option value='all'>All moderators</option>");
    Object.keys(mods).sort().forEach(function (k) {
      o.push("<option value='" + esc(k) + "'>" + esc(mods[k]) + "</option>");
    });
    o.push("</select>");
    o.push("<span id='count' class='count' style='display:none'></span>");
    o.push("<button id='reset' type='button'>Clear</button>");
  }
  if (view === 'one') o.push("<button id='newtab' type='button'>Open in new tab</button>");
  o.push("<span style='flex:1'></span>");
  o.push("<button type='button' onclick='window.print()'>Print</button>");
  o.push("<button id='logout' type='button'>Sign out</button>");
  o.push("</div></nav>");
  return o.join('');
}

// ---------------- list view (the schedule) ----------------
function listHtml(s) {
  var ev = SESSION.ordered, o = [];
  o.push("<div class='wrap'>");
  o.push("<div id='people' class='people' style='display:none'></div>");
  o.push(LANECTRL);
  o.push(s.common);
  DAYS.forEach(function (day) {
    var rows = ev.filter(function (e) { return e.meta.day === day; });
    if (!rows.length) return;
    o.push("<div class='dayblock'><h2 class='dayhead'>" + day + "</h2>");
    o.push("<table class='sched'><thead><tr><th>Time</th><th>Event</th>" +
      "<th>Place</th><th>Moderator</th><th>Entries</th><th>Format</th>" +
      "</tr></thead><tbody>");
    rows.forEach(function (e) {
      o.push("<tr data-day='" + esc(day) + "' data-mods='" + esc(modsOf(e)) +
        "' data-search='" + esc(searchBlob(e)) + "'>" +
        "<td>" + esc(e.meta.time) + "</td>" +
        "<td><a href='#/e/" + esc(e.meta.slug) + "'>" + esc(e.meta.name) +
        " &#8250;</a></td>" +
        "<td>" + esc(e.meta.place) + "</td>" +
        "<td>" + (esc(e.meta.mods) || '—') + "</td>" +
        "<td>" + e.meta.total + "</td>" +
        "<td>" + (FMT[e.meta.kind] || '—') + "</td></tr>");
    });
    o.push("</tbody></table></div>");
  });
  o.push("</div>");
  o.push("<footer class='f'>Jalsa 5.0 &middot; you can see " + ev.length +
    " of " + Object.keys(BUNDLE.events).length + " events &middot; " +
    "<span class='lanenote'></span>" +
    "<div class='copy'>" + COPYRIGHT + "</div></footer>");
  return o.join('');
}

// ---------------- single event view ----------------
function oneHtml(s, e) {
  var ev = SESSION.ordered;
  var i = ev.indexOf(e), o = [];
  o.push("<div class='wrap evpage'>");
  o.push("<div class='ev' style='padding:0 16px 16px'>");
  o.push("<h1 class='title' style='padding-top:14px'>" + esc(e.meta.name) + "</h1>");
  o.push(e.body);
  o.push("</div>");
  o.push("<div class='prevnext'>");
  o.push(i > 0 ? "<a href='#/e/" + esc(ev[i - 1].meta.slug) + "'>&#8592; " +
    esc(ev[i - 1].meta.name) + "</a>" : "<span></span>");
  o.push(i < ev.length - 1 ? "<a href='#/e/" + esc(ev[i + 1].meta.slug) + "'>" +
    esc(ev[i + 1].meta.name) + " &#8594;</a>" : "<span></span>");
  o.push("</div></div>");
  o.push("<footer class='f'>Jalsa 5.0 &middot; <span class='lanenote'></span>" +
    " &middot; <a href='#/'>back to all events</a>" +
    "<div class='copy'>" + COPYRIGHT + "</div></footer>");
  return o.join('');
}

// ---------------- router ----------------
function currentSlug() {
  var m = /^#\/e\/([A-Za-z0-9-]+)/.exec(location.hash || '');
  return m ? m[1] : null;
}
function route() {
  var s = SESSION.s, slug = currentSlug();
  var e = slug ? SESSION.ordered.filter(function (x) {
    return x.meta.slug === slug; })[0] : null;
  var app = document.getElementById('app');
  app.innerHTML = shellHtml(s, e ? 'one' : 'list') +
                  (e ? oneHtml(s, e) : listHtml(s));
  app.style.display = 'block';
  app.hidden = false;
  document.getElementById('gate').style.display = 'none';
  document.title = (e ? e.meta.name + ' — ' : '') + 'Jalsa 5.0 — ' + s.user.label;
  if (e) wireOne(e); else wireList();
  initLanes();
  initDraw();
  initLate();
  initLists();
  window.scrollTo(0, 0);
}

function renderApp(s) {
  SESSION = { s: s, ordered: sortEvents(s.events) };
  // people index built only from events this user can decrypt
  var map = {};
  SESSION.ordered.forEach(function (e) {
    e.people.forEach(function (p) {
      var k = (p[0] + '|' + p[1] + '|' + p[2]).toLowerCase();
      if (!map[k]) map[k] = { n: p[0], b: p[1], f: p[2], c: p[3],
                              s: p[0].toLowerCase(), e: [] };
      map[k].e.push([e.meta.name, '#/e/' + e.meta.slug, p[4], e.meta.day,
                     e.meta.when]);
    });
  });
  PEOPLE = Object.keys(map).map(function (k) { return map[k]; })
    .sort(function (a, b) { return a.s.localeCompare(b.s); });
  window.addEventListener('hashchange', route);
  route();
}

function wireCommon() {
  var lo = document.getElementById('logout');
  if (lo) lo.addEventListener('click', function () {
    sessionStorage.removeItem('jalsa_sess');
    location.hash = '';
    location.reload();
  });
}

function wireOne(e) {
  wireCommon();
  var btn = document.getElementById('newtab');
  if (btn) btn.addEventListener('click', function () {
    // Snapshot what is on screen now, so the new tab matches the current lane
    // setting without needing the key material.
    var css = '';
    document.querySelectorAll('style').forEach(function (s) { css += s.textContent; });
    var body = document.querySelector('.evpage .ev').innerHTML;
    var doc = "<!DOCTYPE html><html><head><meta charset='utf-8'>" +
      "<meta name='viewport' content='width=device-width,initial-scale=1'>" +
      "<meta name='robots' content='noindex,nofollow'>" +
      "<title>" + esc(e.meta.name) + " — Jalsa 5.0</title><style>" + css +
      "</style></head><body><div class='wrap evpage'>" +
      "<div class='ev' style='padding:0 16px 16px'>" + body +
      "</div></div><footer class='f'><div class='copy'>" + COPYRIGHT +
      "</div></footer></body></html>";
    var url = URL.createObjectURL(new Blob([doc], { type: 'text/html' }));
    var w = window.open(url, '_blank');
    if (!w) alert('Your browser blocked the new tab. Allow pop-ups for this ' +
                  'site, or use Print instead.');
  });
}

function wireList() {
  wireCommon();
  var q = document.getElementById('q'), day = document.getElementById('day'),
      mod = document.getElementById('mod'),
      count = document.getElementById('count'),
      nav = document.querySelector('nav.jump'),
      intro = document.querySelectorAll('.risks');
  var lastKey = null;

  function scrollTo_(el) {
    var pad = (nav ? nav.offsetHeight : 0) + 10;
    var y = el.getBoundingClientRect().top + window.pageYOffset - pad;
    window.scrollTo({ top: Math.max(0, y), behavior: 'smooth' });
  }
  function apply() {
    var t = (q.value || '').toLowerCase().trim(), d = day.value, m = mod.value;
    var searching = !!t || d !== 'all' || m !== 'all', hits = [];
    document.querySelectorAll('tr[data-search]').forEach(function (tr) {
      var ok = ((d === 'all') || tr.dataset.day === d) &&
               (!t || tr.dataset.search.indexOf(t) > -1) &&
               ((m === 'all') ||
                (' ' + tr.dataset.mods + ' ').indexOf(' ' + m + ' ') > -1);
      tr.style.display = ok ? '' : 'none';
      tr.classList.toggle('hit', ok && searching);
      if (ok) hits.push(tr);
    });
    document.querySelectorAll('.dayblock').forEach(function (b) {
      b.style.display =
        b.querySelectorAll('tr[data-search]:not([style*="none"])').length
          ? '' : 'none';
    });
    intro.forEach(function (el) { el.style.display = searching ? 'none' : ''; });
    var nPeople = renderPeople(t);
    if (searching) {
      var bits = [];
      if (nPeople) bits.push(nPeople + (nPeople === 1 ? ' person' : ' people'));
      bits.push(hits.length + (hits.length === 1 ? ' event' : ' events'));
      count.textContent = bits.join(', ');
      count.style.display = 'inline-block';
    } else { count.style.display = 'none'; }
    var key = t + '|' + d + '|' + m;
    if (searching && key !== lastKey) {
      var box = document.getElementById('people');
      var target = (nPeople && box.effectiveVisible !== false &&
                    box.style.display !== 'none') ? box
                 : (hits[0] ? (hits[0].closest('.dayblock') || hits[0]) : null);
      if (target) scrollTo_(target);
    }
    lastKey = searching ? key : null;
  }
  q.addEventListener('input', apply);
  day.addEventListener('change', apply);
  mod.addEventListener('change', apply);
  q.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') { q.value = ''; apply(); }
    if (e.key === 'Enter') {
      var a = document.querySelector('tr.hit a[href^="#/e/"]');
      if (a) location.hash = a.getAttribute('href');
    }
  });
  document.getElementById('reset').addEventListener('click', function () {
    q.value = ''; day.value = 'all'; mod.value = 'all'; apply();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  });
}

// ---------------- gate wiring ----------------
document.addEventListener('DOMContentLoaded', function () {
  var f = document.getElementById('loginform'),
      err = document.getElementById('err'),
      btn = document.getElementById('go');

  async function attempt(user, pass, quiet) {
    btn.disabled = true; btn.textContent = 'Unlocking…';
    var s = null;
    try {
      s = await login(user.trim().toLowerCase(), pass);
    } catch (e) {
      if (!quiet) { err.textContent = e.message; err.style.display = 'block'; }
      sessionStorage.removeItem('jalsa_sess');
      btn.disabled = false; btn.textContent = 'Sign in';
      return;
    }
    try {
      sessionStorage.setItem('jalsa_sess',
        JSON.stringify({ u: user.trim().toLowerCase(), p: pass }));
      renderApp(s);
    } catch (e) {
      err.textContent = 'Signed in, but the page failed to render: ' +
        (e && e.message ? e.message : e) + ' — please report this.';
      err.style.display = 'block';
      btn.disabled = false; btn.textContent = 'Sign in';
      throw e;
    }
  }

  f.addEventListener('submit', function (e) {
    e.preventDefault();
    err.style.display = 'none';
    attempt(document.getElementById('u').value,
            document.getElementById('p').value, false);
  });

  var saved = sessionStorage.getItem('jalsa_sess');
  if (saved) {
    try { var o = JSON.parse(saved); attempt(o.u, o.p, true); } catch (e) {}
  }
});
</script>
